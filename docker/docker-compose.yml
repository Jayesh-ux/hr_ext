# hr_ext — production-shaped compose stack for a real Docker host.
#
# NOT executed in the authoring sandbox (no container runtime there). This file
# exists so the port is a `docker compose up` on a real host, and it deliberately
# includes the processes the sandbox could not run:
#   * queue-short / queue-long  -> RQ workers (background + e-mail)
#   * scheduler                 -> runs hr_ext daily sweep + attrition scoring
#   * websocket                 -> realtime
#   * frontend (nginx)          -> serves built assets, proxies backend
#
# Secrets come from docker/secrets.env (git-ignored); nothing is baked in.
# See docker/README-docker.md for the exact bring-up and verification steps.

x-app-env: &app-env
  DB_HOST: ${DB_HOST:-mariadb}
  DB_PORT: ${DB_PORT:-3306}
  REDIS_CACHE: ${REDIS_CACHE:-redis-cache:6379}
  REDIS_QUEUE: ${REDIS_QUEUE:-redis-queue:6379}
  SITE_NAME: ${SITE_NAME:-hr.localhost}
  DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
  FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-hr.localhost}
  HR_EXT_DEFAULT_COUNTRY: ${HR_EXT_DEFAULT_COUNTRY:-india}
  HR_EXT_NUDGE_HR_USER: ${HR_EXT_NUDGE_HR_USER:-}
  HR_EXT_NUDGE_CHANNEL: ${HR_EXT_NUDGE_CHANNEL:-}
  HR_EXT_EMAIL_NOW: ${HR_EXT_EMAIL_NOW:-}

x-app-volumes: &app-volumes
  - sites:/home/frappe/frappe-bench/sites
  - logs:/home/frappe/frappe-bench/logs

services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-cache:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  configurator:
    image: ${HR_EXT_IMAGE:-hr_ext:v15}
    depends_on:
      mariadb: {condition: service_healthy}
    environment: *app-env
    volumes: *app-volumes
    entrypoint: ["bash", "-lc"]
    command:
      - |
        bench set-config -g db_host "$$DB_HOST" &&
        bench set-config -g redis_cache "redis://$$REDIS_CACHE" &&
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE" &&
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE" &&
        bench set-config -g developer_mode 0
    restart: "no"

  create-site:
    image: ${HR_EXT_IMAGE:-hr_ext:v15}
    depends_on:
      configurator: {condition: service_completed_successfully}
    environment: *app-env
    volumes: *app-volumes
    entrypoint: ["bash", "-lc"]
    command:
      - |
        bench new-site "$$SITE_NAME" \
          --db-root-password "$$DB_ROOT_PASSWORD" \
          --admin-password "$$ADMIN_PASSWORD" \
          --install-app erpnext --install-app hrms --install-app hr_ext \
          --set-default &&
        bench --site "$$SITE_NAME" migrate &&
        bench --site "$$SITE_NAME" execute hr_ext.setup.configure &&
        bench --site "$$SITE_NAME" enable-scheduler &&
        bench build && bench --site "$$SITE_NAME" clear-cache
    restart: "no"

  backend:
    image: ${HR_EXT_IMAGE:-hr_ext:v15}
    depends_on:
      create-site: {condition: service_completed_successfully}
    environment: *app-env
    volumes: *app-volumes
    command:
      - |
        exec gunicorn --chdir=/home/frappe/frappe-bench/sites \
          --bind=0.0.0.0:8000 --workers=4 --threads=4 --worker-class=gthread \
          --worker-tmp-dir=/dev/shm --timeout=120 --preload frappe.app:application
    restart: unless-stopped

  websocket:
    image: ${HR_EXT_IMAGE:-hr_ext:v15}
    depends_on:
      create-site: {condition: service_completed_successfully}
    environment: *app-env
    volumes: *app-volumes
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    restart: unless-stopped

  queue-short:
    image: ${HR_EXT_IMAGE:-hr_ext:v15}
    depends_on:
      create-site: {condition: service_completed_successfully}
    environment: *app-env
    volumes: *app-volumes
    command: ["bench", "worker", "--queue", "short,default"]
    restart: unless-stopped

  queue-long:
    image: ${HR_EXT_IMAGE:-hr_ext:v15}
    depends_on:
      create-site: {condition: service_completed_successfully}
    environment: *app-env
    volumes: *app-volumes
    command: ["bench", "worker", "--queue", "long,default,short"]
    restart: unless-stopped

  scheduler:
    image: ${HR_EXT_IMAGE:-hr_ext:v15}
    depends_on:
      create-site: {condition: service_completed_successfully}
    environment: *app-env
    volumes: *app-volumes
    command: ["bench", "schedule"]
    restart: unless-stopped

  frontend:
    image: ${HR_EXT_NGINX_IMAGE:-frappe/erpnext-nginx:version-15}
    depends_on:
      backend: {condition: service_started}
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-hr.localhost}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - assets:/home/frappe/frappe-bench/sites/assets
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
  assets:
  logs:
