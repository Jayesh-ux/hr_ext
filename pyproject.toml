[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-ext"
version = "0.1.0"
description = "AI-native HR extensions for Frappe HR v15: conversational layer, country payroll rules, attrition analytics, nudges, i18n."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "frappe>=15.0.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["hr_ext*"]

[tool.setuptools.package-data]
hr_ext = [
    "payroll/country_data/*.json",
    "i18n/languages/*.json",
    "translations/*.po",
    "hr_extensions/doctype/*/*.json",
    "hr_extensions/page/*/*.json",
    "hr_extensions/page/*/*.html",
    "hr_extensions/page/*/*.js",
]